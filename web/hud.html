<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iris HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --c:#5ff3ff; --c2:#2bb8ff; --warn:#ffb020; --bad:#ff4757; --ok:#3dffa0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#02060a; overflow:hidden; cursor:none; }
  #stage { position:fixed; inset:0; }
  #cam { position:absolute; object-fit:contain; filter:saturate(1.05) contrast(1.05); }
  #depth { position:absolute; object-fit:cover; border:1px solid rgba(95,243,255,.6); opacity:.92; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  #hint { position:fixed; bottom:6px; right:10px; color:#5ff3ff55; font:11px "JetBrains Mono",monospace; transition:opacity .3s; }
  #freeze { position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:5; font:700 15px "JetBrains Mono",monospace; letter-spacing:1px;
    color:#5ff3ff; background:rgba(2,14,22,.75); border:1px solid #5ff3ff; padding:9px 18px; cursor:pointer; transition:opacity .3s; }
  #freeze.on { color:#ffb020; border-color:#ffb020; }
  body.idle #freeze, body.idle #hint { opacity:0; pointer-events:none; }
  body:not(.idle) { cursor:default; }
</style>
</head>
<body>
<div id="stage">
  <img id="cam" src="/raw.mjpg" alt="Live glasses camera">
  <img id="depth" src="/stream.mjpg" alt="Depth view">
  <canvas id="hud"></canvas>
</div>
<button id="freeze">❚❚ FREEZE  [SPACE]</button>
<div id="hint">SPACE: freeze · H: hide depth · F: fullscreen</div>
<script>
const C = { c: "#5ff3ff", c2: "#2bb8ff", warn: "#ffb020", bad: "#ff4757", ok: "#3dffa0", dim: "rgba(95,243,255,.35)" };
const LV = { clear: C.ok, caution: C.warn, stop: C.bad };
const cv = document.getElementById("hud"), g = cv.getContext("2d"), cam = document.getElementById("cam"), dep = document.getElementById("depth");
let frozen = false, frozenAt = 0;
let S = null, W = 0, H = 0, R = { x: 0, y: 0, w: 0, h: 0 }, showDepth = true, typed = "", typedSrc = "", typedAt = 0;
const MONO = '"JetBrains Mono", ui-monospace, Menlo, monospace', DISP = 'Rajdhani, "Segoe UI", sans-serif';

function layout() {
  W = innerWidth; H = innerHeight; const dpr = devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const fw = (S && S.frame ? S.frame[0] : 640), fh = (S && S.frame ? S.frame[1] : 480);
  const s = Math.min(W / fw, H / fh); R = { w: fw * s, h: fh * s }; R.x = (W - R.w) / 2; R.y = (H - R.h) / 2;
  Object.assign(cam.style, { left: R.x + "px", top: R.y + "px", width: R.w + "px", height: R.h + "px" });
  const pw = Math.max(170, Math.min(260, W * 0.15)), ph = pw * 0.75;
  Object.assign(dep.style, { right: "28px", top: (H * 0.5 - ph / 2 + 70) + "px", width: pw + "px", height: ph + "px", display: showDepth ? "block" : "none" });
  dep._r = { x: W - 28 - pw, y: H * 0.5 - ph / 2 + 70, w: pw, h: ph };
}
addEventListener("resize", layout);
addEventListener("keydown", (e) => { const k = e.key.toLowerCase(); if (e.code === "Space") { e.preventDefault(); toggleFreeze(); } if (k === "h") { showDepth = !showDepth; layout(); } if (k === "f") document.documentElement.requestFullscreen?.(); });

async function poll() { if (frozen) return; try { const s = await (await fetch("/api/state", { cache: "no-store" })).json(); const first = !S; S = s; if (first) layout(); } catch (e) {} }
setInterval(poll, 150); poll();

// ---- drawing helpers ----
function glow(col, blur = 12) { g.shadowColor = col; g.shadowBlur = blur; }
function noGlow() { g.shadowBlur = 0; }
function line(x0, y0, x1, y1) { g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
function text(t, x, y, size, col = C.c, font = MONO, align = "left", weight = 600) {
  g.font = `${weight} ${size}px ${font}`; g.fillStyle = col; g.textAlign = align; g.textBaseline = "alphabetic"; g.fillText(t, x, y);
}
function brackets(x, y, w, h, col, len = 18, lw = 2.5) {
  g.strokeStyle = col; g.lineWidth = lw; glow(col, 14);
  for (const [cx, cy, dx, dy] of [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]]) {
    g.beginPath(); g.moveTo(cx + dx * len, cy); g.lineTo(cx, cy); g.lineTo(cx, cy + dy * len); g.stroke();
  }
  noGlow();
}
function panel(x, y, w, h, title) {
  g.fillStyle = "rgba(2,14,22,.42)"; g.fillRect(x, y, w, h);
  g.strokeStyle = "rgba(95,243,255,.18)"; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, w, h);
  g.strokeStyle = C.c; g.lineWidth = 2; line(x, y, x + 34, y); line(x, y, x, y + 14);
  text(title, x + 12, y + 22, 13, C.c, MONO, "left", 600);
  g.strokeStyle = "rgba(95,243,255,.18)"; line(x + 12, y + 30, x + w - 12, y + 30);
}
function arc(cx, cy, r, a0, a1, col, lw) { g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); g.arc(cx, cy, r, a0, a1); g.stroke(); }

// ---- the HUD ----
// ---- freeze frame: snapshot both video streams + hold the data and animations still ----
function snap(img) {
  try { const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext("2d").drawImage(img, 0, 0); return c.toDataURL("image/jpeg", .95); } catch (e) { return null; }
}
function toggleFreeze() {
  const b = document.getElementById("freeze");
  if (!frozen) {
    const a = snap(cam), d2 = snap(dep);
    if (a) cam.src = a; if (d2) dep.src = d2;
    frozen = true; frozenAt = performance.now(); b.textContent = "▶ LIVE  [SPACE]"; b.classList.add("on");
  } else {
    cam.src = "/raw.mjpg?" + Date.now(); dep.src = "/stream.mjpg?" + Date.now();
    frozen = false; b.textContent = "❚❚ FREEZE  [SPACE]"; b.classList.remove("on"); poll();
  }
}
document.getElementById("freeze").onclick = toggleFreeze;
let idleT = null;
function wake() { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 2000); }
addEventListener("mousemove", wake); wake();

function draw(nowReal) {
  requestAnimationFrame(draw);
  const now = frozen ? frozenAt : nowReal;   // frozen: animations hold still too
  g.clearRect(0, 0, W, H);
  const t = now / 1000;
  // vignette + frame edge
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,8,14,.5)"); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  // scanline sweep over the camera
  const sy = R.y + ((t * 0.18) % 1) * R.h;
  const sg = g.createLinearGradient(0, sy - 60, 0, sy); sg.addColorStop(0, "rgba(95,243,255,0)"); sg.addColorStop(1, "rgba(95,243,255,.05)");
  g.fillStyle = sg; g.fillRect(R.x, sy - 60, R.w, 60); g.strokeStyle = "rgba(95,243,255,.18)"; g.lineWidth = 1; line(R.x, sy, R.x + R.w, sy);
  // fine grid ticks on the frame border
  g.strokeStyle = C.dim; g.lineWidth = 1;
  g.strokeStyle = "rgba(95,243,255,.22)";
  for (let i = 1; i < 8; i++) { const x = R.x + R.w * i / 8; line(x, R.y, x, R.y + 8); line(x, R.y + R.h, x, R.y + R.h - 8); }
  for (let i = 1; i < 6; i++) { const y = R.y + R.h * i / 6; line(R.x, y, R.x + 8, y); line(R.x + R.w, y, R.x + R.w - 8, y); }
  brackets(R.x - 6, R.y - 6, R.w + 12, R.h + 12, C.c, 34, 2);

  const s = S;
  // ---- title block ----
  glow(C.c, 10); text("IRIS", 36, 64, 44, C.c, DISP, "left", 700); noGlow();
  text("VISUAL ASSIST SYSTEM", 38, 86, 13, C.c2);
  const online = s && s.fps > 0;
  g.fillStyle = online ? C.ok : C.bad; glow(g.fillStyle, 10); g.beginPath(); g.arc(44, 106, 5, 0, 7); g.fill(); noGlow();
  text(online ? "ONLINE · LIVE CLASSIFICATION" : "CONNECTING…", 56, 111, 13, online ? C.ok : C.bad);
  const d = new Date(); text(d.toTimeString().slice(0, 8), 38, 134, 13, C.dim);
  // ---- top right: telemetry ----
  const tx = W - 36;
  text(`${s ? s.fps.toFixed(1) : "--"} FPS`, tx, 64, 30, C.c, DISP, "right", 700);
  text(`SOURCE  ${s ? String(s.source).toUpperCase().slice(0, 18) : "--"}`, tx, 88, 12, C.c2, MONO, "right");
  text("ON-DEVICE · DEPTH ANYTHING V2 · EFFICIENTDET · APPLE VISION", tx, 106, 11, C.dim, MONO, "right", 400);
  if (!s) return;

  const sx = R.w / s.frame[0], sy2 = R.h / s.frame[1];
  // ---- object locks ----
  for (const dt of s.detections || []) {
    const [bx, by, bw, bh] = dt.box, x = R.x + bx * sx, y = R.y + by * sy2, w = bw * sx, h = bh * sy2;
    const z = s.zones[dt.zone] || {}, col = z.level === "stop" ? C.bad : z.level === "caution" ? C.warn : C.c;
    brackets(x, y, w, h, col, Math.min(24, w / 3, h / 3), 2);
    const lab = `${dt.label.toUpperCase()}  ${Math.round(dt.score * 100)}%`, near = z.near != null ? (z.near > .75 ? "NEAR" : z.near > .5 ? "MID" : "FAR") : "";
    g.font = `700 15px ${MONO}`; const tw = g.measureText(lab).width + 18;
    const lx = Math.max(R.x + 6, Math.min(x, R.x + R.w - tw - 6)), ly = Math.max(R.y + 30, y - 10);   // keep labels on the video
    g.fillStyle = "rgba(2,14,22,.82)"; g.fillRect(lx, ly - 20, tw, 26); g.strokeStyle = col; g.lineWidth = 1.5; g.strokeRect(lx, ly - 20, tw, 26);
    text(lab, lx + 9, ly - 2, 15, col, MONO, "left", 700);
  }

  // ---- centre reticle (colour = centre path state) ----
  const cz = s.zones.center || {}, rc = LV[cz.level] || C.c, cx = R.x + R.w / 2, cy = R.y + R.h / 2;
  glow(rc, 14);
  arc(cx, cy, 46, t * 1.2, t * 1.2 + 1.2, rc, 2.5); arc(cx, cy, 46, t * 1.2 + Math.PI, t * 1.2 + Math.PI + 1.2, rc, 2.5);
  noGlow(); g.strokeStyle = rc; g.lineWidth = 1.5;
  line(cx - 20, cy, cx - 8, cy); line(cx + 8, cy, cx + 20, cy); line(cx, cy - 20, cx, cy - 8); line(cx, cy + 8, cx, cy + 20);
  g.fillStyle = rc; g.beginPath(); g.arc(cx, cy, 2.5, 0, 7); g.fill();

  // ---- zone tint strip along the bottom of the frame ----
  ["left", "center", "right"].forEach((zn, i) => {
    const z = s.zones[zn] || { near: 0, level: "clear" }, col = LV[z.level], x0 = R.x + R.w * i / 3, x1 = x0 + R.w / 3;
    const gr = g.createLinearGradient(0, R.y + R.h - 60, 0, R.y + R.h); gr.addColorStop(0, col + "00"); gr.addColorStop(1, col + (z.level === "clear" ? "18" : "44"));
    g.fillStyle = gr; g.fillRect(x0 + 3, R.y + R.h - 60, R.w / 3 - 6, 60);
    const lbl = s.clear === zn ? `${zn.toUpperCase()} · GO` : z.level !== "clear" ? `${zn.toUpperCase()} · ${z.level.toUpperCase()}` : "";
    if (lbl) text(lbl, (x0 + x1) / 2, R.y + R.h - 14, 13, col, MONO, "center", 700);
  });

  // ---- left panel: detections ----
  const px = 28, pw = Math.max(240, Math.min(300, W * .18));
  let py = 170;
  const dets = s.detections || [];
  panel(px, py, pw, 44 + Math.max(1, dets.length) * 30, "OBJECTS IN VIEW");
  if (!dets.length) text("scanning…", px + 14, py + 60, 13, C.dim);
  dets.forEach((dt, i) => {
    const y = py + 58 + i * 30, col = (LV[(s.zones[dt.zone] || {}).level] === C.bad) ? C.bad : C.c;
    text(dt.label.toUpperCase(), px + 14, y, 14, col, MONO, "left", 700); text(`${Math.round(dt.score * 100)}%`, px + pw - 14, y, 13, col, MONO, "right");
    g.fillStyle = "rgba(255,255,255,.1)"; g.fillRect(px + 14, y + 6, pw - 28, 3); g.fillStyle = col; g.fillRect(px + 14, y + 6, (pw - 28) * dt.score, 3);
  });
  py += 64 + Math.max(1, dets.length) * 30;
  // path radar
  panel(px, py, pw, 190, "PATH");
  const rx = px + pw / 2, ry = py + 170, rr = Math.min(130, pw * .48);
  const A = { left: [-62, -21], center: [-20, 20], right: [21, 62] };
  for (const zn of ["left", "center", "right"]) {
    const z = s.zones[zn] || { near: 0, level: "clear" }, col = LV[z.level], [a0, a1] = A[zn].map((a) => (a - 90) * Math.PI / 180);
    g.fillStyle = col + (z.level === "clear" ? "22" : "55"); g.beginPath(); g.moveTo(rx, ry); g.arc(rx, ry, rr, a0, a1); g.closePath(); g.fill();
    glow(col, 10); arc(rx, ry, rr * (1 - z.near * .8), a0 + .03, a1 - .03, col, 4); noGlow();
  }
  g.fillStyle = C.c; g.beginPath(); g.arc(rx, ry, 5, 0, 7); g.fill();
  py += 206;
  // status / last readouts
  const lines = [];
  if (s.read) lines.push(["TEXT", s.read.replace(/^Text: /, "")]);
  if (s.color) lines.push(["COLOR", s.color]);
  if (s.describe) lines.push(["SCENE", s.describe]);
  if (lines.length) {
    panel(px, py, pw, 40 + lines.length * 40, "READOUTS");
    lines.forEach(([k, v], i) => { text(k, px + 14, py + 58 + i * 40, 11, C.c2); text(v.length > 34 ? v.slice(0, 33) + "…" : v, px + 14, py + 75 + i * 40, 13, C.c); });
  }

  // ---- right: depth PIP + nearest gauge + status ----
  const dr = dep._r;
  if (showDepth && dr) { brackets(dr.x - 4, dr.y - 4, dr.w + 8, dr.h + 8, C.c, 16, 2); text("DEPTH · ONE CAMERA", dr.x, dr.y - 12, 12, C.c); text("FAR", dr.x, dr.y + dr.h + 18, 11, C.dim); text("NEAR", dr.x + dr.w, dr.y + dr.h + 18, 11, C.bad, MONO, "right");
    const lg = g.createLinearGradient(dr.x + 30, 0, dr.x + dr.w - 40, 0); lg.addColorStop(0, "#000004"); lg.addColorStop(.4, "#781c6d"); lg.addColorStop(.75, "#ed6925"); lg.addColorStop(1, "#fcffa4");
    g.fillStyle = lg; g.fillRect(dr.x + 30, dr.y + dr.h + 12, dr.w - 70, 4); }
  const gx = W - 28 - 90, gy = (dr ? dr.y : H / 2) - 120, nv = s.nearest || 0, ncol = nv > .75 ? C.bad : nv > .55 ? C.warn : C.ok;
  arc(gx, gy, 58, Math.PI * .75, Math.PI * 2.25, "rgba(255,255,255,.08)", 5);
  arc(gx, gy, 58, Math.PI * .75, Math.PI * .75 + Math.PI * 1.5 * nv, ncol, 5);
  text(`${Math.round(nv * 100)}`, gx, gy + 10, 34, ncol, DISP, "center", 700); text("NEAREST", gx, gy + 30, 11, C.c2, MONO, "center");
  // mode flags
  const flags = s.sos ? [["SOS", true]] : [];
  flags.forEach(([k, on], i) => { const y = (dr ? dr.y + dr.h : H / 2) + 50 + i * 24, col = k === "SOS" && on ? C.bad : on ? C.ok : C.dim;
    g.fillStyle = col; g.fillRect(W - 28 - 10, y - 9, 8, 8); text(k, W - 28 - 18, y, 12, col, MONO, "right"); });

  // ---- bottom: what Iris is saying (typed) ----
  const ev = (s.events || [])[s.events.length - 1];
  if (ev && ev.text !== typedSrc && Date.now() / 1000 - ev.t < 6) { typedSrc = ev.text; typedAt = now; }
  if (typedSrc) {
    const age = (now - typedAt) / 1000, shown = typedSrc.slice(0, Math.floor(age * 45)), col = ev && ev.level === "stop" ? C.bad : ev && ev.level === "caution" ? C.warn : C.c;
    if (age < 7) {
      const by = R.y + R.h - 46;   // just above the zone strip
      g.font = `700 26px ${DISP}`; const tw = g.measureText(typedSrc).width + 70;
      g.fillStyle = "rgba(2,14,22,.75)"; g.fillRect(W / 2 - tw / 2, by - 30, tw, 42); g.strokeStyle = col; g.lineWidth = 1.5; g.strokeRect(W / 2 - tw / 2, by - 30, tw, 42);
      glow(col, 12); text("▶ " + shown.toUpperCase() + (Math.floor(now / 400) % 2 ? "_" : ""), W / 2, by, 24, col, DISP, "center", 700); noGlow();
    }
  }
  // ---- camera signal lost (auto-reconnect running on the server) ----
  if (s.cam === "reconnecting") { g.fillStyle = "rgba(2,6,10,.6)"; g.fillRect(R.x, R.y, R.w, R.h);
    text("SIGNAL LOST · RECONNECTING TO GLASSES", W / 2, H / 2 + 90, 22, C.warn, DISP, "center", 700); }
  // ---- SOS overlay ----
  if (s.sos && Math.floor(now / 450) % 2) { g.strokeStyle = C.bad; g.lineWidth = 10; glow(C.bad, 30); g.strokeRect(8, 8, W - 16, H - 16); noGlow();
    text("SOS · " + s.sos.reason.toUpperCase(), W / 2, 60, 34, C.bad, DISP, "center", 700); }
}
layout(); requestAnimationFrame(draw);
</script>
</body>
</html>
